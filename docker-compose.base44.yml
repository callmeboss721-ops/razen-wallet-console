# Base44 dev environment — runs the app from cloned source with live reload.
# DO NOT use the project's own compose; this is development-oriented.
services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      # Keep installed node_modules inside the container, not overwritten by host
      - web_node_modules:/app/node_modules
    ports:
      - "3000:8080"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy can reach the dev server
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    restart: on-failure
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  web_node_modules:
