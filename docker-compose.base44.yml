# Base44 dev environment for RAZEN Transfer Console.
# Single-origin Vite + TanStack Start app. PGLite (embedded Postgres WASM) is
# used in-process when DATABASE_URL is unset, so no database service is needed.
services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:8080"
    environment:
      # Auth off = the project's own shipped default. The federated sign-in
      # broker (auth.grok.me / *.grok-sandbox.com) is Grok-platform-specific and
      # is not reachable from this preview, so disable it to expose the dev
      # user instead of an unfinishable login. Safe: no DATABASE_URL is set, so
      # requireUserId() resolves the dev user rather than failing closed.
      - VITE_AUTH_ENABLED=false
      # Vite >= 6.1 appends this to its dev-server allowedHosts, letting the
      # preview proxy's external hostname through. Set by the platform.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
