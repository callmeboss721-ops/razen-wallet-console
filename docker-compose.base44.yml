services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview's external
      # hostname is accepted for dev assets / HMR.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${BASE44_PUBLIC_HOST_SUFFIX}
      # Pass through so any code that builds a public URL can resolve it.
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      # Auth off in the Base44 preview — the Grok auth broker only accepts
      # *.grok-sandbox.com callbacks, so federated sign-in can't work here.
      # The app still renders and all non-auth features work.
      VITE_AUTH_ENABLED: "false"
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    restart: unless-stopped

volumes:
  node_modules:
