services:
  web:
    image: node:22-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "3000:8080"
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the preview proxy's
      # external hostname is accepted. Bare = pass through from host env.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
